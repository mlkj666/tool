name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: flutter pub get

      - name: Verify Flutter sources
        run: |
          flutter analyze
          flutter test

      - name: Build iOS app without signing
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        id: package
        run: |
          APP_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          DISPLAY_VERSION=${APP_VERSION%%+*}
          IPA_NAME="bs.${DISPLAY_VERSION}.ipa"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry "$IPA_NAME" Payload
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bs-${{ steps.package.outputs.display_version }}
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 14
